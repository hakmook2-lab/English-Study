<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let's Talk! 영어 공부</title>
<meta name="theme-color" content="#16213a">
<meta name="description" content="대학생 영어 공부 앱: 단어 카드, 문장 말하기, 역할극 대화, 21일 플랜">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Let's Talk!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f9; --card:#ffffff; --ink:#16213a; --sub:#5f6b82; --line:#dde2ec;
  --blue:#2d5be3; --blue-soft:#e6edfd; --mark:#ffd84d; --mark-soft:#fff4c2;
  --good:#1e9e6a; --bad:#e5484d; --bA:#ffffff; --bB:#e6edfd;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1524; --card:#18213a; --ink:#e7ecf6; --sub:#98a3ba; --line:#2a3552;
    --blue:#7fa2ff; --blue-soft:#1f2c50; --mark:#e8c23a; --mark-soft:#3a3420;
    --good:#3cc08a; --bad:#ff6b6f; --bA:#1d2744; --bB:#233463;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1524; --card:#18213a; --ink:#e7ecf6; --sub:#98a3ba; --line:#2a3552;
  --blue:#7fa2ff; --blue-soft:#1f2c50; --mark:#e8c23a; --mark-soft:#3a3420;
  --good:#3cc08a; --bad:#ff6b6f; --bA:#1d2744; --bB:#233463;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.en{font-family:"Literata",Georgia,"Times New Roman",serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.logo{font-family:"Literata",Georgia,serif;font-weight:700;font-size:22px;letter-spacing:-.3px}
.logo small{font-family:"IBM Plex Sans KR",sans-serif;font-weight:500;font-size:13px;color:var(--sub);margin-left:6px}
.trackchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
main{padding:8px 16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:9px 0 10px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:20px;font-weight:400;line-height:1}
nav.tabs button.on{color:var(--blue);font-weight:700}
h2{font-size:19px;margin:18px 2px 10px}
h3{font-size:16px;margin:0}
.muted{color:var(--sub);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.list .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.item .ic{font-size:24px;width:32px;text-align:center}
.item .tx{flex:1;min-width:0}
.item .tx small{display:block;color:var(--sub);font-size:13px}
.item .go{color:var(--sub);font-size:20px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue);margin-left:6px;vertical-align:2px;font-weight:500}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:500}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--card);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;margin-top:10px}
.row>.btn{flex:1}
.row.wrap>.btn{flex:1 1 28%}
.hintw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;letter-spacing:3px;margin-top:14px;word-break:break-all;line-height:1.5}
.spin{width:100%;font-family:"Literata",Georgia,serif;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:center;margin-top:12px}
.spin:focus{border-color:var(--blue);outline:none}
.spin.ok{border-color:var(--good)} .spin.ng{border-color:var(--bad);text-decoration:line-through}
.res{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:16px}
.res.ok{background:color-mix(in srgb,var(--good) 14%,var(--card));border:1px solid var(--good)}
.res.ng{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid var(--bad)}
.res .ans{font-family:"Literata",Georgia,serif;font-size:24px;font-weight:700;margin-top:4px}
.wrap{flex-wrap:wrap}
/* hero */
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:20px 18px;margin-top:6px;position:relative;overflow:hidden}
.hero .day{font-family:"Literata",Georgia,serif;font-size:44px;font-weight:700;line-height:1}
.hero .day span{font-size:18px;opacity:.6;font-weight:500}
.hero p{margin:8px 0 0;opacity:.8;font-size:14px}
.hero .hl{background:linear-gradient(transparent 55%,var(--mark) 55%);color:var(--bg)}
.grid21{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.grid21 button{aspect-ratio:1;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;font-size:13px;padding:0}
.grid21 button.done{background:var(--mark);color:#16213a;border-color:var(--mark);font-weight:700}
.grid21 button.today{outline:2px solid var(--mark);outline-offset:1px}
.grid21 button.sel{background:rgba(255,255,255,.18)}
.stat{display:flex;gap:10px}
.stat .panel{flex:1;margin:0}
.stat b{font-size:24px;font-family:"Literata",Georgia,serif}
/* flashcard */
.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.topbar .back{border:0;background:none;font-size:26px;padding:0 6px;color:var(--sub)}
.topbar .t{flex:1;font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .n{color:var(--sub);font-size:14px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.flash{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:300px;padding:28px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .word{font-size:38px;font-weight:700;line-height:1.2;letter-spacing:-.5px}
.flash .word.en{background:linear-gradient(transparent 62%,var(--mark-soft) 62%);padding:0 4px}
.flash .ko{font-size:22px;font-weight:700;margin-top:14px}
.flash .ex{margin-top:16px;font-size:17px;line-height:1.5}
.flash .exko{margin-top:4px;color:var(--sub);font-size:14px}
.flash .hint{margin-top:22px;color:var(--sub);font-size:13px}
.big{font-size:22px;font-weight:700;line-height:1.45}
.speakhint{display:inline-block;margin-top:14px;font-size:13px;color:var(--sub);border:1px dashed var(--line);padding:5px 10px;border-radius:8px}
.answer{margin-top:18px;font-size:21px;line-height:1.45;background:linear-gradient(transparent 60%,var(--mark-soft) 60%)}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:17px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.ng{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
/* dialog */
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.line{display:flex;flex-direction:column;max-width:86%}
.line.A{align-self:flex-start}
.line.B{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--sub);margin:0 6px 3px}
.bubble{border:1px solid var(--line);border-radius:16px;padding:10px 13px;background:var(--bA);text-align:left;font-size:16px;line-height:1.45}
.line.A .bubble{border-top-left-radius:4px}
.line.B .bubble{background:var(--bB);border-top-right-radius:4px}
.bubble .k{display:block;font-size:13px;color:var(--sub);margin-top:4px;font-family:"IBM Plex Sans KR",sans-serif}
.bubble.hid{background:transparent;border-style:dashed;border-width:2px;color:var(--sub);font-family:"IBM Plex Sans KR",sans-serif}
.bubble.hid b{display:block;color:var(--ink);font-size:15px;margin-top:2px}
.bubble.cur{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
/* settings */
label.f{display:block;margin:14px 0 6px;font-weight:500}
select,input[type=range],textarea{width:100%}
select,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px}
textarea{min-height:90px;font-size:12px;word-break:break-all}
.pick{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px}
.pick.on{border-color:var(--blue);background:var(--blue-soft)}
.pick b{font-size:18px}
.pick span{display:block;color:var(--sub);font-size:14px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.center{text-align:center}
.autobar{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.autobar .btn{flex:0 0 auto}
.autobar .st{flex:1;font-size:13px;color:var(--sub);line-height:1.35}
.autobar.on .st{color:var(--blue);font-weight:500}
.btn.play{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.flash.playing{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.banner{display:flex;gap:10px;align-items:center;background:var(--mark-soft);border:1px solid var(--mark);border-radius:12px;padding:11px 12px;margin:6px 0 10px;font-size:14px}
.banner .tx{flex:1}
.banner .x{border:0;background:none;color:var(--sub);font-size:18px;padding:0 4px}
details.help{border-top:1px solid var(--line);padding:10px 0}
details.help:first-of-type{border-top:0}
details.help summary{cursor:pointer;font-weight:500;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"＋";float:right;color:var(--sub)}
details.help[open] summary::after{content:"－"}
details.help ol{margin:8px 0 0;padding-left:20px;font-size:14px}
details.help li{margin:4px 0}
details.help code{background:var(--blue-soft);color:var(--blue);padding:1px 6px;border-radius:5px;font-family:inherit;font-weight:500}
.grp{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.grp h2{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">Let's Talk!<small>영어 공부</small></div>
    <button class="trackchip" id="trackchip" type="button"></button>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs"><div class="in">
  <button data-tab="home" type="button"><b>🗓</b>오늘</button>
  <button data-tab="words" type="button"><b>🃏</b>단어</button>
  <button data-tab="sets" type="button"><b>🗣</b>문장</button>
  <button data-tab="dialogs" type="button"><b>💬</b>대화</button>
  <button data-tab="settings" type="button"><b>⚙️</b>설정</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
window.addEventListener("error",ev=>{
  const m=document.getElementById("main");
  if(m&&!m.children.length)m.innerHTML='<div style="padding:20px;border:1px solid #e5484d;border-radius:12px;margin-top:20px"><b>앱을 여는 중 오류가 났어요.</b><p style="font-size:14px">페이지를 새로고침해 보세요. 계속되면 아래 내용을 캡처해서 보내 주세요.</p><code style="font-size:12px;word-break:break-all">'+String(ev.message).replace(/</g,"&lt;")+' (line '+ev.lineno+')</code></div>';
});
/* =========================================================
   DATA  — track: common(공통) / biz(경영) / eng(영문)
   words: [영어, 뜻, 예문, 예문 해석]
   ========================================================= */
const CATS = [
{id:"campus",track:"common",icon:"🏫",ko:"캠퍼스 생활",en:"Campus Life",w:[
["syllabus","강의계획서","Please read the syllabus before the first class.","첫 수업 전에 강의계획서를 읽어 오세요."],
["assignment","과제","The assignment is due next Monday.","과제는 다음 주 월요일까지입니다."],
["deadline","마감일","Can I get an extension on the deadline?","마감일을 연장받을 수 있을까요?"],

["semester","학기","I'm taking five courses this semester.","이번 학기에 다섯 과목을 들어요."],
["major","전공","What's your major?","전공이 뭐예요?"],
["scholarship","장학금","She got a full scholarship.","그녀는 전액 장학금을 받았어요."],
["attendance","출석","Attendance counts for ten percent of the grade.","출석이 성적의 10%를 차지해요."],
["midterm","중간고사","How did your midterm go?","중간고사 어땠어?"],
["group project","조별 과제","We have a group project in marketing class.","마케팅 수업에 조별 과제가 있어."],
["return to school","복학하다","I'm returning to school after my military service.","군 복무를 마치고 복학해요."],
["dormitory","기숙사","I live in the dormitory on campus.","캠퍼스 기숙사에 살아요."]]},
{id:"daily",track:"common",icon:"💬",ko:"일상 필수 표현",en:"Everyday Phrases",w:[
["figure out","알아내다, 이해하다","I can't figure out this problem.","이 문제를 도저히 모르겠어."],
["catch up","근황을 나누다, 따라잡다","Let's catch up over coffee.","커피 마시면서 근황 얘기하자."],
["hang out","어울려 놀다","Do you want to hang out this weekend?","이번 주말에 같이 놀래?"],
["run out of","~이 다 떨어지다","We ran out of time.","시간이 다 됐어."],
["look forward to","~을 기대하다","I'm looking forward to the trip.","여행이 기대돼."],
["get used to","~에 익숙해지다","I'm getting used to the new schedule.","새 일정에 익숙해지고 있어."],
["make it","시간 맞춰 가다, 해내다","Sorry, I can't make it tonight.","미안, 오늘 밤엔 못 가."],
["come up with","(생각을) 떠올리다","She came up with a great idea.","그녀가 좋은 아이디어를 냈어."],
["put off","미루다","Don't put off your homework.","숙제 미루지 마."],
["sort of","약간, 좀","I'm sort of tired today.","오늘 좀 피곤해."]]},
{id:"bizbasic",track:"biz",icon:"🏢",ko:"경영 기초",en:"Business Basics",w:[
["revenue","매출","Our revenue grew by twelve percent this year.","올해 매출이 12% 늘었어요."],
["profit","이익","The company made a profit of two million dollars.","회사는 200만 달러의 이익을 냈어요."],
["stakeholder","이해관계자","We must consider all stakeholders.","모든 이해관계자를 고려해야 해요."],
["strategy","전략","We need a new strategy for the Asian market.","아시아 시장을 위한 새 전략이 필요해요."],
["competitor","경쟁사","Our main competitor lowered its prices.","주요 경쟁사가 가격을 내렸어요."],
["market share","시장 점유율","We increased our market share to twenty percent.","시장 점유율을 20%로 높였어요."],
["supply chain","공급망","The supply chain was affected by the storm.","태풍으로 공급망에 차질이 생겼어요."],
["merger","합병","The merger will be completed next year.","합병은 내년에 완료될 거예요."],
["efficiency","효율성","The new system improved efficiency.","새 시스템이 효율성을 높였어요."],
["entrepreneur","기업가, 창업가","He wants to be an entrepreneur.","그는 창업가가 되고 싶어 해요."],
["negotiate","협상하다","We need to negotiate the contract terms.","계약 조건을 협상해야 해요."],
["launch","출시하다","They will launch a new product in May.","그들은 5월에 신제품을 출시해요."]]},
{id:"finance",track:"biz",icon:"📊",ko:"회계·재무",en:"Accounting & Finance",w:[

["liability","부채","The company has too many liabilities.","그 회사는 부채가 너무 많아요."],
["equity","자본","Assets equal liabilities plus equity.","자산은 부채와 자본의 합이에요."],

["income statement","손익계산서","The income statement shows a net loss.","손익계산서에 순손실이 나타나요."],
["cash flow","현금흐름","Positive cash flow is important for small businesses.","작은 기업에는 플러스 현금흐름이 중요해요."],
["depreciation","감가상각","Depreciation reduces the value of equipment over time.","감가상각은 시간이 지나며 설비 가치를 줄여요."],
["budget","예산","We are over budget this quarter.","이번 분기 예산을 초과했어요."],
["interest rate","금리","The central bank raised the interest rate.","중앙은행이 금리를 올렸어요."],
["dividend","배당금","The company pays a dividend every year.","그 회사는 매년 배당금을 지급해요."],
["audit","회계감사","The annual audit starts next week.","연례 회계감사가 다음 주에 시작돼요."],

/* =========================================================
   SPEECH (TTS) — 첫 터치 전에는 소리 안 냄 / 안전 타이머 / 모바일 화면 꺼지면 정지

let voices=[], koVoices=[], gesture=false, speakToken=0, playing=false;
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function voiceScore(v){
  const n=v.name||"";let s=0;
  if(/en[-_]US/i.test(v.lang))s+=2;
  if(/natural|premium|enhanced|neural|online|향상|고품질/i.test(n))s+=6;
  if(/Google US English|Samantha|Ava|Aria|Jenny|Zoe|Evan|Nathan|Allison|Susan|Tom/i.test(n))s+=3;
  if(/compact|novelty|eloquence|bad news|bells|boing|bubbles|cellos|jester|organ|trinoids|whisper|zarvox|albert|fred|junior|ralph|kathy|superstar|wobble|grandma|grandpa|rocko|shelley|flo|reed|sandy|good news|hysterical|deranged/i.test(n))s-=8;
  return s;
}
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));}catch(e){voices=[];}}
if("speechSynthesis" in window){loadVoices();loadKoVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();loadKoVoices();if(view.name==="settings")render();};}
document.addEventListener("pointerdown",()=>{gesture=true;},{capture:true});
document.addEventListener("keydown",()=>{gesture=true;},{capture:true});
function loadKoVoices(){try{koVoices=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));}catch(e){koVoices=[];}}
function speak(text,rate,lang){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)||!gesture){res(true);return;}
    const my=++speakToken;
    try{speechSynthesis.cancel();}catch(e){}
    const r=rate||(lang==="ko"?1:S.rate);
    let fin=false;
    const done=()=>{if(fin)return;fin=true;clearTimeout(t);res(my===speakToken);};
    const t=setTimeout(done,1800+text.length*120/r);
    setTimeout(()=>{
      if(my!==speakToken){done();return;}
      const u=new SpeechSynthesisUtterance(text);
      const ko=lang==="ko";
      u.lang=ko?"ko-KR":"en-US";u.rate=r;
      if(ko&&!koVoices.length)loadKoVoices();
      const v=ko?koVoices[0]:(voices.find(x=>x.name===S.voice)||voices[0]);
      if(v)u.voice=v;
      u.onend=done;u.onerror=done;
      try{speechSynthesis.speak(u);}catch(e){done();}
    },60);
  });
}

    if(on&&"wakeLock" in navigator&&!wakeLock&&!document.hidden){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null;});}
    else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){}
}

/* =========================================================
   21-DAY PLAN
   ========================================================= */
function dayDiff(a,b){const pa=a.split("-").map(Number),pb=b.split("-").map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5);}
function today(){return Math.max(1,Math.min(21,dayDiff(S.start,todayStr())+1));}
function plan(d){
  const cs=fCats().filter(c=>c.group!=="seoyun"),ss=fSets(),ds=fDlgs();
  if(d%7===0)return[{t:"review"},{t:"quiz",id:"all"},{t:"dialog",id:ds[(d/7-1)%ds.length].id}];
  const k=d-1-Math.floor(d/7);
  const tasks=[{t:"card",id:cs[k%cs.length].id}];
  if(k%2===0)tasks.push({t:"set",id:ss[Math.floor(k/2)%ss.length].id});
  else tasks.push({t:"dialog",id:ds[Math.floor(k/2)%ds.length].id});
  return tasks;
}
function taskInfo(x){
  if(x.t==="card"){const c=cat(x.id);return{ic:c.icon,ti:"단어 · "+c.ko,sub:c.w.length+"개 카드 넘기기",view:"card",id:x.id};}
  if(x.t==="set"){const s=setOf(x.id);return{ic:s.icon,ti:"문장 · "+s.title,sub:s.items.length+"문장 영어로 말하기",view:"set",id:x.id};}
  if(x.t==="dialog"){const g=dlgOf(x.id);return{ic:g.icon,ti:"대화 · "+g.title,sub:"한쪽 역할 숨기고 말하기",view:"dialog",id:x.id};}

  return{ic:"🏆",ti:"주간 퀴즈",sub:"이번 트랙 단어 10문제",view:"quiz",id:"all"};
}

$("#trackchip").addEventListener("click",()=>go("pick"));

function render(){
  applyTheme();
  if(!S.track&&view.name!=="pick")view={name:"pick",first:true};
  $("#trackchip").textContent=S.track?TRACKS[S.track].label:"트랙 선택";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB_OF[view.name]));
  const f={home:vHome,words:vWords,card:vCard,quiz:vQuiz,spell:vSpell,sets:vSets,set:vSet,dialogs:vDialogs,dialog:vDialog,settings:vSettings,pick:vPick}[view.name]||vHome;
  main.innerHTML=f();
  if(view.name==="spell"){const sp=$("#sp");if(sp&&!sp.disabled){try{sp.focus({preventScroll:true});const L=sp.value.length;sp.setSelectionRange(L,L);}catch(e){}}}
  if(view.autostart){view.autostart=false;const fn={card:autoCards,set:autoSet,dialog:playDialog}[view.name];if(fn)setTimeout(fn,150);}
  if(view.name==="dialog"){const c=main.querySelector(".bubble.cur");if(c)c.scrollIntoView({block:"center",behavior:"smooth"});}
}

/* ---------- spelling (뜻 → 영어 철자) ---------- */
function normSp(t){return String(t).toLowerCase().replace(/[\u2018\u2019`]/g,"'").replace(/[\s\-]+/g,"").trim();}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function spellAnswers(en){
  const base=sayOf(en), set=new Set([base]);
  en.replace(/\s*\([^)]*\)/g,"").split("/").forEach(p=>{p=p.trim();if(p)set.add(p);});
  (en.match(/\(([^)]*)\)/g)||[]).forEach(m=>{const t=m.slice(1,-1).trim();
    if(/^[A-Za-z'\-]+$/.test(t)&&lev(t.toLowerCase(),base.toLowerCase())<=2)set.add(t);});   /* 영·미 철자 변형 허용: candour/candor 등 */
  return [...set];
}
function hintOf(ans,shown){
  let k=0;
  return ans.split("").map(ch=>{
    if(/[A-Za-z]/.test(ch)){k++;return k<=shown?esc(ch):"_";}
    if(ch===" ")return "&nbsp;&nbsp;";
    return esc(ch);
  }).join(" ");
}
function buildSpell(id,n){
  const pool=poolOf(id);
  return shuffle(pool).slice(0,n||effN(pool.length)).map(w=>({w,ans:spellAnswers(w.en),input:"",res:null,shown:1}));
}
function vSpell(){
  if(!view.sq){view.sq=buildSpell(view.id,view.n);view.i=0;view.score=0;view.end=false;}
  const title=(view.id==="review"?"복습":titleOf(view.id))+" · 철자";
  const back=view.from||"words";
  if(!view.sq.length)return topbar(title,"",back)+`<div class="panel center" style="margin-top:20px"><div class="big">문제로 낼 단어가 없어요</div></div>`;
  if(view.end||view.i>=view.sq.length){
    const answered=view.sq.filter(q=>q.res), wrong=answered.filter(q=>q.res!=="ok");
    return topbar(title,"",back)+`<div class="panel center" style="margin-top:14px"><div class="big">${view.score} / ${answered.length}점</div>
      <p class="muted">${answered.length&&!wrong.length?"철자까지 완벽해요! ✍️🏆":"틀린 단어는 '모르는 단어 복습'에도 들어갔어요."}</p>
      ${wrong.length?`<div style="text-align:left;margin:10px 0">${wrong.map(q=>`<div style="padding:7px 0;border-top:1px solid var(--line)"><span class="en"><b>${esc(q.ans[0])}</b></span> — ${esc(q.w.ko)}<br><span class="muted">내 답: ${q.input?esc(q.input):"(모름)"}</span></div>`).join("")}</div>`:""}
      <div class="row wrap">${wrong.length?`<button class="btn pri" data-act="spRetry">틀린 것만 다시 (${wrong.length})</button>`:""}<button class="btn" data-act="spRestart">새로 섞어서 다시</button><button class="btn" data-act="go" data-view="words">목록</button></div></div>`;
  }
  const q=view.sq[view.i], A=q.ans[0], letters=A.replace(/[^A-Za-z]/g,"").length;
  const res=q.res?`<div class="res ${q.res}">${q.res==="ok"?`✅ 정답!${q.shown>1?` <span class="muted">(힌트 ${q.shown-1}개 사용)</span>`:""}<div class="ans">${esc(A)}</div>`:`❌ 정답<div class="ans">${esc(A)}</div><div class="muted">내 답: ${q.input?esc(q.input):"(모름)"}</div>`}
      ${q.w.en!==A?`<div class="muted" style="margin-top:4px">표제어: ${esc(q.w.en)}</div>`:""}</div>`:"";
  return topbar(title,(view.i+1)+" / "+view.sq.length,back)+`
  <div class="prog"><i style="width:${view.i/view.sq.length*100}%"></i></div>
  <div class="panel center" style="margin-top:14px">
    <div class="muted">뜻을 보고 영어 철자를 쓰세요</div>
    <div style="font-size:21px;font-weight:700;margin-top:6px;line-height:1.4">${esc(q.w.ko)}</div>
    <div class="hintw">${hintOf(A,q.res?99:q.shown)}</div>
    <div class="muted">${letters}글자${/\s/.test(A)?" · 여러 단어":""}</div>
  </div>
  <input id="sp" class="spin ${q.res||""}" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${q.res?"next":"done"}" placeholder="영어로 입력" value="${esc(q.input)}" ${q.res?"disabled":""}>
  ${res}
  ${q.res

}
function spCurrent(){const q=view.sq&&view.sq[view.i];const sp=$("#sp");if(q&&sp&&!q.res)q.input=sp.value;return q;}
function spCheck(){
  const q=spCurrent(); if(!q||q.res)return;
  if(!q.input.trim()){toast("철자를 입력하세요");$("#sp")&&$("#sp").focus();return;}
  const ok=q.ans.some(a=>normSp(a)===normSp(q.input));
  q.res=ok?"ok":"ng";
  if(ok)view.score++; else{S.known[q.w.id]=0;save();}
  render(); speak(q.w.say);

/* ---------- quiz ---------- */
/* 퀴즈 방향: en = 영어 보고 뜻 고르기 / ko = 뜻 보고 영어 고르기 */
function buildQuiz(id,n,dir){
  const pool=poolOf(id), all=allWords(), key=dir==="ko"?"en":"ko";
  return shuffle(pool).slice(0,n||effN(pool.length)).map(w=>{
    const src=pool.length>=4?pool:all;
    const wrong=shuffle(src.filter(x=>x[key]!==w[key])).filter((x,i,arr)=>arr.findIndex(y=>y[key]===x[key])===i).slice(0,3).map(x=>x[key]);
    return {w,ans:w[key],opts:shuffle([w[key],...wrong]),pick:null};
  });
}
function quizDirSeg(){
  const d=S.quizDir||"en", total=poolOf(view.id).length, cur=view.qs?view.qs.length:0;
  const counts=[10,30,50,100,0].filter(n=>n===0||n<total);
  const cnt=`<div class="seg" style="margin-top:8px">${counts.map(n=>`<button class="${(n===0?total:n)===cur?"on":""}" data-act="quizCount" data-v="${n}">${n===0?"전체 "+total:n+"문제"}</button>`).join("")}</div>`;
  return cnt+`<div class="seg" style="margin-top:10px">${[["en","영어 → 뜻 고르기"],["ko","뜻 → 영어 고르기"]].map(([k,l])=>`<button class="${d===k?"on":""}" data-act="quizDir" data-v="${k}">${l}</button>`).join("")}</div>`;
}
function vQuiz(){
  const dir=S.quizDir||"en";
  if(!view.qs){view.qs=buildQuiz(view.id,view.n,dir);view.i=0;view.score=0;}
  const title=titleOf(view.id)+" 퀴즈 · "+view.qs.length+"문제";
  if(view.i>=view.qs.length){
    const wrong=view.qs.filter(q=>q.pick!==q.ans);
    return topbar(title,"","words")+quizDirSeg()+`<div class="panel center" style="margin-top:14px"><div class="big">${view.score} / ${view.qs.length}점</div>
      <p class="muted">${view.score===view.qs.length?"완벽해요! 🏆":"틀린 단어는 '모르는 단어 복습'에 들어갔어요."}</p>
      ${wrong.length?`<div style="text-align:left;margin:10px 0">${wrong.map(q=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><span class="en"><b>${esc(q.w.en)}</b></span> — ${esc(q.w.ko)}</div>`).join("")}</div>`:""}
      <div class="row"><button class="btn pri" data-act="restartQuiz">다시 풀기</button><button class="btn" data-act="go" data-view="words">목록</button></div></div>`;
  }
  const q=view.qs[view.i], answered=q.pick!==null;
  const question=dir==="ko"
    ?`<div class="muted">뜻에 맞는 영어 단어를 고르세요</div><div style="font-size:24px;font-weight:700;margin-top:6px;line-height:1.4">${esc(q.w.ko)}</div>
      ${answered?`<button class="btn sm" style="margin-top:10px" data-act="say" data-text="${esc(q.w.say)}">🔊 듣기</button>`:""}`
    :`<div class="word en" style="font-size:32px;font-weight:700">${esc(q.w.en)}</div>
      <button class="btn sm" style="margin-top:10px" data-act="say" data-text="${esc(q.w.say)}">🔊 듣기</button>`;
  return topbar(title,(view.i+1)+" / "+view.qs.length,"words")+`
  <div class="prog"><i style="width:${view.i/view.qs.length*100}%"></i></div>
  ${view.i===0&&!answered?quizDirSeg():""}
  <div class="panel center" style="margin-top:14px">${question}</div>
  ${q.opts.map((o,i)=>{let c="";if(answered){if(o===q.ans)c="ok";else if(o===q.pick)c="ng";}return `<button class="opt ${dir==="ko"?"en":""} ${c}" data-act="quizPick" data-i="${i}" ${answered?"disabled":""}>${esc(o)}</button>`;}).join("")}
  ${answered?`${dir==="ko"?`<div class="panel" style="margin-top:12px"><span class="en"><b>${esc(q.w.en)}</b></span> — ${esc(q.w.ko)}</div>`:""}${q.w.ex?`<div class="panel" style="margin-top:12px"><div class="en">${esc(q.w.ex)}</div><div class="muted">${esc(q.w.exKo)}</div></div>`:""}<div class="row"><button class="btn pri" data-act="quizNext">다음 ›</button></div>`:""}`;
}

async function playDialog(){
  const g=dlgOf(view.id), my=beginRun(), alive=()=>playing&&runId===my&&view.name==="dialog";
  do{
    for(let i=0;i<g.lines.length;i++){
      if(!alive())return;
      const L=g.lines[i]; view.cur=i; render();
      if(view.hide===L[0]&&!view.revd.includes(i)){
        await wait(1500+L[1].length*75);
        if(!alive())return;
        view.revd.push(i); render();
      }
      for(let r=0;r<S.ap.rep;r++){await speak(L[1]);if(!alive())return;if(r<S.ap.rep-1)await wait(600);}
      await wait(380);
    }
    if(S.ap.loop&&alive()){await wait(gapMs()*1.5);view.revd=[];view.cur=-1;}
  }while(S.ap.loop&&alive());
  if(runId===my){playing=false;keepAwake(false);view.cur=-1;render();}
}

/* ---------- auto play: cards & sentences ---------- */
async function autoCards(){
  const my=beginRun(), alive=()=>playing&&runId===my&&view.name==="card";
  if(view.i>=view.deck.length){view.i=0;view.res={yes:0,no:0};}
  while(alive()){
    if(view.i>=view.deck.length){if(S.ap.loop){view.i=0;}else break;}
    const w=view.deck[view.i], enFirst=S.front==="en";
    view.rev=false;view.spoke=true;render();
    if(enFirst){
      for(let r=0;r<S.ap.rep;r++){await speak(w.say);if(!alive())return;await wait(r<S.ap.rep-1?600:gapMs());if(!alive())return;}
      view.rev=true;render();
      if(S.ap.ko){await speak(koSpeak(w.ko),1,"ko");if(!alive())return;await wait(gapMs()*0.6);if(!alive())return;}
    }else{
      if(S.ap.ko){await speak(koSpeak(w.ko),1,"ko");if(!alive())return;}
      await wait(gapMs()*1.5);if(!alive())return;
      view.rev=true;render();
      for(let r=0;r<S.ap.rep;r++){await speak(w.say);if(!alive())return;await wait(600);if(!alive())return;}
    }
    if(S.ap.ex&&w.ex){await speak(w.ex);if(!alive())return;}
    await wait(gapMs());if(!alive())return;
    view.i++;
  }
  if(runId===my){playing=false;keepAwake(false);render();}
}
async function autoSet(){
  const s=setOf(view.id), my=beginRun(), alive=()=>playing&&runId===my&&view.name==="set";
  while(alive()){
    if(view.i>=s.items.length){if(S.ap.loop){view.i=0;}else{view.i=s.items.length-1;view.rev=true;break;}}
    const it=s.items[view.i];
    view.rev=false;render();
    if(S.ap.ko){await speak(it[0],1,"ko");if(!alive())return;}
    await wait(gapMs()+it[1].length*60);if(!alive())return;   /* 내가 말해 볼 시간 */
    view.rev=true;render();
    for(let r=0;r<S.ap.rep;r++){await speak(it[1]);if(!alive())return;await wait(r<S.ap.rep-1?700:gapMs());if(!alive())return;}
    view.i++;
  }
  if(runId===my){playing=false;keepAwake(false);render();}
}

    <details class="help" ${isAndroid?"open":""}><summary>갤럭시·안드로이드</summary><ol>
      <li><code>설정</code> 앱 맨 위 🔍 검색에서 <code>텍스트 음성 변환</code> 또는 <code>TTS</code> 검색</li>
      <li><code>기본 엔진</code>을 <code>Google 음성 인식 및 합성</code>으로 선택 (삼성 엔진보다 영어가 자연스러워요)</li>
      <li>엔진 옆 ⚙️ → <code>음성 데이터 설치</code> → <code>English (United States)</code> 다운로드</li>
      <li>같은 화면에서 목소리 종류를 골라 미리 들어볼 수 있어요.</li>
      <li>Chrome과 이 앱을 다시 열고, 위 <b>목소리</b>에서 선택</li>
    </ol></details>
    <details class="help"><summary>컴퓨터 (윈도우·맥)</summary><ol>
      <li>가장 쉬운 방법: <b>Microsoft Edge</b> 브라우저로 이 앱을 열면 <code>Aria / Jenny Online (Natural)</code> 같은 고품질 음성이 바로 나와요.</li>
      <li>Chrome에서는 <code>Google US English</code>를 고르세요.</li>
      <li>맥: <code>시스템 설정</code> → <code>손쉬운 사용</code> → <code>읽기 및 말하기</code> → <code>시스템 음성</code> → <code>음성 관리</code>에서 영어(미국) 프리미엄 음성 받기</li>
    </ol></details>
  </div>
  ${installPanel()}
  <div class="panel">
    <h3>진도 백업·복원</h3>
    <p class="muted">진도는 이 기기에만 저장돼요. 폰을 바꾸거나 브라우저 기록을 지우기 전에 백업 코드를 복사해 카톡 '나와의 채팅'에 보관하세요.</p>
    <div class="row"><button class="btn" data-act="backupMake">백업 코드 만들기</button><button class="btn" data-act="backupCopy">복사</button></div>
    <textarea id="bk" placeholder="백업 코드가 여기에 나와요. 복원할 때는 여기에 붙여넣으세요."></textarea>
    <div class="row"><button class="btn pri" data-act="restore">붙여넣은 코드로 복원</button></div>
  </div>
  <div class="panel">
    <h3>초기화</h3>
    <div class="row"><button class="btn" data-act="restartPlan">21일 플랜 오늘부터 다시</button><button class="btn bad" data-act="reset">${view.resetArm?"한 번 더 누르면 전부 삭제":"모든 기록 삭제"}</button></div>
  </div>
  <p class="muted center">Let's Talk! 버전 ${APP_VERSION}</p>`;
}

/* =========================================================
   ACTIONS
   ========================================================= */
main.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(playing&&["card","set"].includes(view.name)&&(!t||!["autoStop","autoNext"].includes(t.dataset.act))){stopAll();render();if(!t||["reveal","setReveal"].includes(t.dataset.act)){toast("자동재생을 멈췄어요");return;}}
  if(!t||t.disabled)return;
  if(t.tagName==="A")e.preventDefault();
  const a=t.dataset.act, d=t.dataset;
  switch(a){
    case "go": go(d.view,{id:d.id,n:d.n?parseInt(d.n):undefined,from:view.name==="home"?"home":undefined,autostart:d.auto==="1"}); break;
    case "say": speak(d.text,d.rate?parseFloat(d.rate):undefined,d.lang); break;
    case "autoCards": autoCards(); break;
    case "autoSet": autoSet(); break;
    case "autoStop": stopAll();render(); break;
    case "autoNext": {   /* 다음 항목으로 — 자동재생 중이면 다음 항목부터 계속 재생 */
      const was=playing; stopAll();
      if(view.name==="card"){view.i=Math.min(view.i+1,view.deck.length);view.rev=false;view.spoke=!was?false:true;}
      else if(view.name==="set"){const n=setOf(view.id).items.length;view.i=Math.min(view.i+1,n-1);view.rev=false;}
      render();
      if(was){if(view.name==="card"&&view.i<view.deck.length)autoCards();else if(view.name==="set")autoSet();}
      break;}
    case "apSet": S.ap[d.k]=parseFloat(d.v);save();render();break;
    case "apToggle": S.ap[d.k]=!S.ap[d.k];save();render();break;
    case "pickTrack": {const first=!S.track;S.track=d.track;save();go(first?"home":"settings");toast(TRACKS[d.track].label+" 선택");break;}
    case "selDay": view.sel=parseInt(d.d);render(); break;
    case "dayDone": {const dm=doneMap(),n=parseInt(d.d);if(dm[n])delete dm[n];else{dm[n]=true;toast(n+"일차 완료! 👏");}save();render();break;}
    /* card */
    case "reveal": if(!view.rev){view.rev=true;const w=view.deck[view.i];render();const tx=S.front==="ko"?w.say:w.ex;if(tx&&(S.front==="ko"||S.auto))speak(tx);} break;
    case "mark": {const w=view.deck[view.i];S.known[w.id]=parseInt(d.v);save();view.res[d.v==="1"?"yes":"no"]++;view.i++;view.rev=false;view.spoke=false;stopAll();render();break;}
    case "prevCard": view.i=Math.max(0,view.i-1);view.rev=false;view.spoke=false;render();break;
    case "shuffleDeck": view.deck=shuffle(view.deck);view.i=0;view.rev=false;view.spoke=false;view.res={yes:0,no:0};render();toast("카드를 섞었어요");break;
    case "flipFront": S.front=S.front==="en"?"ko":"en";save();if(view.name==="card"){view.rev=false;view.spoke=false;}render();break;
    case "restartDeck": view.deck=buildDeck(view.id);view.i=0;view.rev=false;view.spoke=false;view.res={yes:0,no:0};render();break;
    case "retryUnknown": view.deck=shuffle(view.deck.filter(w=>S.known[w.id]===0));view.i=0;view.rev=false;view.spoke=false;view.res={yes:0,no:0};render();break;
    /* quiz */
    case "quizPick": {const q=view.qs[view.i];q.pick=q.opts[parseInt(d.i)];if(q.pick===q.ans){view.score++;}else{S.known[q.w.id]=0;save();}render();speak(q.w.say);break;}
    case "quizNext": view.i++;render();break;
    case "restartQuiz": view.qs=null;render();break;
    case "quizCount": {const n=parseInt(d.v);S.quizN=n;save();view.n=undefined;view.qs=null;render();toast(n===0?"전체 문제":n+"문제");break;}
    case "quizDir": if((S.quizDir||"en")!==d.v){S.quizDir=d.v;save();view.qs=null;render();toast(d.v==="ko"?"뜻 보고 영어 고르기":"영어 보고 뜻 고르기");} break;
    /* spelling */
    case "spCheck": spCheck(); break;
    case "spHint": {const q=spCurrent();q.shown++;render();break;}
    case "spGiveup": {const q=spCurrent();q.res="ng";S.known[q.w.id]=0;save();render();speak(q.w.say);break;}
    case "spNext": view.i++;render();window.scrollTo(0,0);break;
    case "spEnd": spCurrent();view.end=true;render();break;
    case "spRetry": view.sq=view.sq.filter(q=>q.res&&q.res!=="ok").map(q=>({w:q.w,ans:q.ans,input:"",res:null,shown:1}));view.sq=shuffle(view.sq);view.i=0;view.score=0;view.end=false;render();break;
    case "spRestart": view.sq=null;render();break;
    /* sets */
    case "setReveal": if(!view.rev){view.rev=true;render();speak(setOf(view.id).items[view.i][1]);} break;
    case "setMove": stopAll();view.i+=parseInt(d.d);view.rev=false;render();break;
    /* dialog */
    case "dlgHide": stopAll();view.hide=d.v;view.revd=[];view.cur=-1;render();break;
    case "dlgPlay": playDialog();break;
    case "dlgStop": stopAll();view.cur=-1;render();break;
    case "dlgKo": S.showKo=!S.showKo;save();render();break;
    case "dlgReset": stopAll();view.revd=[];view.cur=-1;render();break;
    case "dlgLine": {const i=parseInt(d.i),L=dlgOf(view.id).lines[i];if(playing)stopAll();if(!view.revd.includes(i))view.revd.push(i);view.cur=i;render();speak(L[1]).then(ok=>{if(ok&&view.name==="dialog"&&!playing){view.cur=-1;render();}});break;}
    /* install */
    case "install": if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render();});} break;
    case "hideInstall": S.hideInstall=true;save();render();break;
    case "openExternal": location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(location.href);break;
    /* settings */
    case "autoToggle": S.auto=!S.auto;save();render();break;
    case "theme": S.theme=d.v;save();render();break;
    case "backupMake": {const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$("#bk").value="LT1:"+code;toast("백업 코드를 만들었어요");break;}
    case "backupCopy": {const ta=$("#bk");if(!ta.value){toast("먼저 백업 코드를 만드세요");break;}
      const ok=()=>toast("복사했어요");
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(ok,()=>{ta.select();try{document.execCommand("copy");ok();}catch(e){toast("길게 눌러 직접 복사하세요");}});
      else{ta.select();try{document.execCommand("copy");ok();}catch(e){toast("길게 눌러 직접 복사하세요");}}
      break;}
    case "restore": {let v=$("#bk").value.trim();try{if(v.startsWith("LT1:"))v=v.slice(4);const obj=JSON.parse(decodeURIComponent(escape(atob(v))));if(!obj||typeof obj!=="object"||!("known" in obj))throw 0;S=Object.assign(def(),obj);save();toast("복원했어요");go("home");}catch(e){toast("코드가 올바르지 않아요. 전체를 붙여넣었는지 확인하세요");}break;}
    case "restartPlan": S.start=todayStr();S.done[S.track]={};save();toast("오늘이 1일차예요");go("home");break;
    case "reset": if(!view.resetArm){view.resetArm=true;render();setTimeout(()=>{if(view.name==="settings"&&view.resetArm){view.resetArm=false;render();}},4000);}else{const tr=S.track;S=def();S.track=tr;save();toast("기록을 모두 지웠어요");go("home");}break;
  }
});
main.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".flash")){e.preventDefault();e.target.click();}
  if(e.key==="Enter"&&e.target.id==="sp"){e.preventDefault();e.stopPropagation();spCheck();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&view.name==="spell"&&view.sq&&view.sq[view.i]&&view.sq[view.i].res&&!(e.target.matches&&e.target.matches("button"))){e.preventDefault();view.i++;render();}
});
main.addEventListener("input",e=>{if(e.target.id==="rate"){S.rate=parseFloat(e.target.value);$("#ratev").textContent=S.rate.toFixed(2)+"x";save();}});
main.addEventListener("change",e=>{if(e.target.id==="voice"){S.voice=e.target.value;save();speak("This is my voice.");}});

render();

/* 오프라인·설치용 서비스워커 (GitHub Pages 등 https 주소에서만 동작) */
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/i.test(location.hostname)){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadController||reloaded)return; reloaded=true;
    stopAll(); toast("새 버전으로 업데이트했어요"); setTimeout(()=>location.reload(),900);
  });
}
</script>
</body>
</html>
